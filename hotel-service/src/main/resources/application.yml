server:
  port: 8081

spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100
  web:
    locale: en
    locale-resolver: fixed

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5

app:
  jwt:
    secret: ${JWT_SECRET:hotel-booking-dev-secret-key-change-me-0123456789}
    ttl: PT1H
    issuer: hotel-booking
  seed:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0

logging:
  file:
    name: logs/${spring.application.name}.log
  structured:
    format:
      file: ecs
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{bookingId:-}] "

springdoc:
  swagger-ui:
    path: /swagger-ui.html
